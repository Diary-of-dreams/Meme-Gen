<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gen</title>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/06f019ef7f.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="CSS/styles.css">

</head>

<body class="main-layout" onload="onInit()">
    <header>
        <div class="header-inner">
            <div class="logo">Meme <span class="gen">Gen.</span></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#gallery" class="basic-btn">Gallery</a></li>
                    <li><a href="#" class="basic-btn">Saved</a></li>
                    <li><a href="#" class="basic-btn">Randomize</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="gallery" id="gallery"></section>
    <main class="editor" id="editor">
        <section class="canvas-container">
            <canvas width="500" height="500" onclick="onCanvasClick(event)"></canvas>
        </section>

        <section class="editor-panel">
            <input type="text" class="txt-input" oninput="onInputTxt(this.value)" placeholder="Enter your text">
            <div class="input-options">
                <button class="basic-btn icon-only" title="Add line" aria-label="Add line" onclick="onAddLine()">
                    <i class="fa-solid fa-circle-plus"></i>
                </button>
                <button class="basic-btn icon-only" title="Switch lines" aria-label="Switch lines"
                    onclick="onSwitchLines()">
                    <i class="fa-solid fa-up-down"></i>
                </button>
                <button class="basic-btn icon-only" title="Delete line" aria-label="Delete line"
                    onclick="onDeleteLine()">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <div class="editor-options">
                <label class="basic-btn color-btn icon-only" title="Text color" aria-label="Text color">
                    <i class="fa-solid fa-fill"></i>
                    <input type="color" id="colorPicker" value="#000000" oninput="onSetColor(this.value)">
                </label>
                <div class="size-control">
                    <button class="basic-btn icon-only" title="Decrease size" aria-label="Decrease size"
                        onclick="onChangeFontSize(-5)">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </button>
                    <span class="size-value" aria-live="polite">35</span>
                    <button class="basic-btn icon-only" title="Increase size" aria-label="Increase size"
                        onclick="onChangeFontSize(5)">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </button>
                </div>

                <button class="basic-btn icon-only" title="Align left" aria-label="Align left" onclick="onAlignLeft()">
                    <i class="fa-solid fa-align-left"></i>
                </button>
                <button class="basic-btn icon-only" title="Align center" aria-label="Align center"
                    onclick="onAlignCenter()">
                    <i class="fa-solid fa-align-center"></i>
                </button>
                <button class="basic-btn icon-only" title="Align right" aria-label="Align right"
                    onclick="onAlignRight()">
                    <i class="fa-solid fa-align-right"></i>
                </button>
                <select class="font-select" title="Font" aria-label="Font" onchange="onSetFont(this.value)">
                    <option value="Impact" selected>Impact</option>
                    <option value="Arial">Arial</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Courier New">Courier New</option>
                    <option value="Comic Sans MS">Comic Sans</option>
                </select>


            </div>

            <div class="editor-actions">
                <a href="#" class="basic-btn" onclick="onDownloadCanvas(this)" download="my-meme.png">Download</a>
                <button class="basic-btn" onclick="onSaveMeme()">Save</button>
                <button class="basic-btn" onclick="onShareMeme(event)">Share</button>
            </div>
        </section>
    </main>


    <script src="JS/utils.js"></script>
    <script src="JS/meme-service.js"></script>
    <script src="JS/gallery-controller.js"></script>
    <script src="JS/meme-controller.js"></script>
    <script src="JS/main-controller.js"></script>
</body>

</html>
