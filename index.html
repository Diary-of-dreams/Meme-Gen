<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Gen</title>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/06f019ef7f.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="CSS/styles.css">

</head>

<body class="main-layout" onload="onInit()">
    <header>
        <div class="header-inner">
            <div class="logo">Meme <span class="gen">Gen.</span></div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#gallery" class="basic-btn">Gallery</a></li>
                    <li><a href="#" class="basic-btn">Saved</a></li>
                    <li><a href="#" class="basic-btn">Randomize</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <section class="gallery" id="gallery"></section>
    <main class="editor" id="editor">
        <section class="canvas-container">
            <canvas width="500" height="500"></canvas>
        </section>

        <section class="editor-panel">
            <input type="text" class="txt-input" oninput="onInputTxt(this.value)" placeholder="Enter your text">
            <div class="input-options">
                <button class="basic-btn icon-only" title="Add line" aria-label="Add line" onclick="onAddLine()">
                     <i class="fa-solid fa-circle-plus"></i>
                </button>
                <button class="basic-btn icon-only" title="Switch lines" aria-label="Switch lines" onclick="onSwitchLines()">
                    <i class="fa-solid fa-up-down"></i>
                </button>
                <button class="basic-btn icon-only" title="Delete line" aria-label="Delete line" onclick="onDeleteLine()">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <div class="editor-options">
                <label class="basic-btn color-btn icon-only" title="Text color" aria-label="Text color">
                    <i class="fa-solid fa-fill"></i>
                    <input type="color" id="colorPicker" value="#000000" oninput="onSetColor(this.value)">
                </label>
                <div class="size-control">
                    <button class="basic-btn icon-only" title="Decrease size" aria-label="Decrease size" onclick="onChangeFontSize(-5)">
                        <i class="fa-solid fa-magnifying-glass-minus"></i>
                    </button>
                    <span class="size-value" aria-live="polite">20</span>
                    <button class="basic-btn icon-only" title="Increase size" aria-label="Increase size" onclick="onChangeFontSize(5)">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </button>
                </div>
            </div>

            <div class="editor-actions">
                <a href="#" class="basic-btn" onclick="onDownloadCanvas(this)" download="my-meme.png">Download</a>
                <button class="basic-btn" onclick="onSaveMeme()">Save</button>
                <button class="basic-btn" onclick="onShareMeme()">Share</button>
            </div>
        </section>
    </main>


    <script src="JS/meme-service.js"></script>
    <script src="JS/gallery-controller.js"></script>
    <script src="JS/meme-controller.js"></script>
    <script src="JS/main-controller.js"></script>
</body>

</html>
